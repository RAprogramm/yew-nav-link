[package]
name = "yew-nav-link"
version = "0.12.6"
authors = ["RAprogramm <andrey.rozanov.vl@gmail.com>"]
edition = "2024"
rust-version = "1.96"
description = "Navigation link component for Yew with automatic active state detection"
documentation = "https://docs.rs/yew-nav-link"
readme = "README.md"
homepage = "https://github.com/RAprogramm/yew-nav-link"
repository = "https://github.com/RAprogramm/yew-nav-link"
license = "MIT"
keywords = ["yew", "router", "navigation", "wasm", "frontend"]
categories = ["gui", "wasm", "web-programming"]
exclude = ["example/**", "fuzz/**", "docs/assets/**"]

[package.metadata.docs.rs]
all-features = true

# cargo-udeps cannot detect usage of crates that participate only through
# proc-macro attributes (`#[wasm_bindgen_test]`) under non-native targets.
# `wasm-bindgen-test` is exercised by `wasm-pack test` in the dedicated CI
# job and is genuinely required there.
[package.metadata.cargo-udeps.ignore]
development = ["wasm-bindgen-test"]

[features]
default = []

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCollection",
  "History",
  "Node",
  "NodeList",
  "EventTarget",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Native-only dev-deps. `criterion` pulls in non-wasm runtime crates and
# `proptest`'s default features pull `rusty-fork` -> `wait-timeout`, which
# does not compile for `wasm32-unknown-unknown`. Both are exercised only by
# native test targets (`tests/proptest_utils.rs`, `benches/`), so gating
# keeps the wasm test build minimal and lets the browser suite link cleanly.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "path"
harness = false

[lib]
crate-type = ["rlib"]

# Mirror of CI's clippy invocation so `cargo clippy` reproduces the gate
# locally; CI escalates these to errors with `-D warnings`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
