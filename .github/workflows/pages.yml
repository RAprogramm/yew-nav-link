name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  TRUNK_PUBLIC_URL: /yew-nav-link/

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Load cached target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: example
          key: pages-example
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build demo with trunk
        run: trunk build --release --public-url "$TRUNK_PUBLIC_URL"
        working-directory: example

      - name: SPA fallback (copy index.html to 404.html)
        run: cp example/dist/index.html example/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
