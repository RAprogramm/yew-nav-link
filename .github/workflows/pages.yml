name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  TRUNK_PUBLIC_URL: /yew-nav-link/

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Load cached target directory
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: example
          key: pages-example
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Build demo with trunk
        run: trunk build --release --public-url "$TRUNK_PUBLIC_URL"
        working-directory: example

      - name: SPA fallback (copy index.html to 404.html)
        run: cp example/dist/index.html example/dist/404.html

      - name: Install mdBook
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2
        with:
          tool: mdbook

      - name: Build book
        run: mdbook build docs

      - name: Stage book under demo /book/
        run: |
          mkdir -p example/dist/book
          cp -r docs/book/. example/dist/book/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: example/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
