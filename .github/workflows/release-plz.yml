# Two-mode release automation driven by release-plz:
#   `release-pr` keeps a single release PR open against `main`, bumping
#   the version and prepending a CHANGELOG section as conventional
#   commits land;
#   `release` runs after the release PR is merged — it tags the commit,
#   publishes to crates.io, and creates the matching GitHub release.
#
# Authentication is via a dedicated GitHub App (see
# `docs/RELEASE_PLZ_APP_SETUP.md`). The App identity is required, not
# optional: PRs opened by `secrets.GITHUB_TOKEN` do not trigger
# downstream workflows (the `CI` checks for the release PR, the
# `Release attestations` workflow for the published release). Using
# the App identity makes every release fully autonomous from a single
# conventional commit on `main`.
#
# See `release-plz.toml` for the per-package configuration and
# `RELEASE.md` for the human-facing flow.

name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    needs: release-plz-release
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # release-plz bumps the root crate but not the separate example/ and
      # fuzz/ workspaces, so their lockfile pins lag the new version and the
      # release PR would fail `sync-versions.sh --check`. Reconcile them (and
      # any doc-snippet minor bump) on the release branch automatically.
      - name: Sync sub-crate lockfiles into the release PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          branch="$(gh pr list --state open --json headRefName,title \
            --jq 'map(select(.title | startswith("chore: release"))) | .[0].headRefName // ""')"
          if [ -z "$branch" ]; then
            echo "No open release PR; nothing to sync."
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          ./scripts/sync-versions.sh
          if git diff --quiet; then
            echo "Sub-crate lockfiles already in sync."
            exit 0
          fi
          git config user.name "release-plz[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync sub-crate lockfiles to release version"
          git push origin "HEAD:$branch"
