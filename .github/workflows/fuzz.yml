# Weekly coverage-guided fuzzing for the path / URL helpers. Each
# target runs for five minutes — long enough to surface a panic or
# overflow, short enough to fit in the free-runner budget.

name: Fuzz

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_normalize_path
          - fuzz_join_paths
          - fuzz_urlencoding_roundtrip
          - fuzz_query_params
          - fuzz_url_parts
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup nightly Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly

      - name: Load cached target directory
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
          save-if: true

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }}
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300
        working-directory: fuzz

      - name: Upload corpus and artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 30
