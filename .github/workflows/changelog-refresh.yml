name: Changelog refresh

# Run weekly so the [Unreleased] block in CHANGELOG.md stays in sync with
# the conventional commits that have landed since the latest tag. Also
# manually triggerable so a maintainer can refresh on demand right before
# cutting a release.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Regenerate [Unreleased] in CHANGELOG.md
        run: |
          set -euo pipefail
          git-cliff --unreleased > /tmp/unreleased.md

          if [ ! -s /tmp/unreleased.md ]; then
            echo "git-cliff produced no output; nothing to refresh."
            exit 0
          fi

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          changelog_path = pathlib.Path("CHANGELOG.md")
          unreleased = pathlib.Path("/tmp/unreleased.md").read_text().strip()

          # If git-cliff yielded nothing more than its header, no commits
          # have landed since the latest tag. Leave CHANGELOG.md alone.
          stripped = unreleased.lower().replace(" ", "")
          if stripped in ("##[unreleased]", ""):
              print("No unreleased commits since the last tag.")
              sys.exit(0)

          changelog = changelog_path.read_text()

          # Match the existing [Unreleased] block and replace it with the
          # regenerated one. The lookahead stops at the next "## [X..."
          # heading so manually-curated [X.Y.Z] sections are untouched.
          pattern = re.compile(
              r"## \[Unreleased\][\s\S]*?(?=\n## \[\d)", re.MULTILINE
          )

          if not pattern.search(changelog):
              print(
                  "CHANGELOG.md missing the [Unreleased] anchor; bailing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          updated = pattern.sub(unreleased + "\n", changelog)

          if updated == changelog:
              print("CHANGELOG.md already in sync.")
              sys.exit(0)

          changelog_path.write_text(updated)
          print("CHANGELOG.md refreshed.")
          PY

      - name: Open or update auto-refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: CHANGELOG.md
          commit-message: |
            chore(changelog): auto-refresh Unreleased section

            Generated by git-cliff from conventional commits since the
            latest tag. Manually-curated [X.Y.Z] sections are not
            modified.
          title: "chore(changelog): auto-refresh Unreleased section"
          body: |
            Automated refresh of the `## [Unreleased]` block in
            `CHANGELOG.md`.

            git-cliff regenerates this section from the conventional
            commits that landed on `main` since the latest tag. The
            curated `[X.Y.Z] - YYYY-MM-DD` sections that drive release
            notes are untouched.

            Merge if the diff matches what the project has shipped, or
            close if a manual entry is being staged for the next release.

            **Note:** GitHub's anti-recursion rule prevents
            `GITHUB_TOKEN`-created PRs from auto-triggering CI. Close
            and reopen this PR (or push a trivial commit to it) to run
            the status checks before merging.
          branch: chore/changelog-refresh
          base: main
          labels: area:docs
          delete-branch: true
